plugins {
    id 'com.android.library'
}

android {
    namespace 'com.kroxaboom.skazka.auth.android'
    compileSdk 35

    defaultConfig {
        minSdk 33
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api project(':auth-core')
}
